[package]
name = "repeatmasker"
kind = "tool"
version = "4.2.5"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/repeatmasker"

[command]
name = "taf-repeatmasker"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/repeatmasker:4.2.5-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64"

[meta]
domain = "bio"
categories = ["repeat-annotation", "genome-masking", "genomics", "transposable-elements", "fasta"]
keywords = ["RepeatMasker", "interspersed repeats", "low complexity DNA", "Dfam", "FamDB", "RepBase", "RMBlast", "TRF", "HMMER", "softmask"]
description = "RepeatMasker screens DNA sequences for interspersed repeats and low-complexity DNA, producing repeat annotations and masked FASTA output."

[upstream]
name = "RepeatMasker"
type = "github"
repo = "Dfam-consortium/RepeatMasker"
url = "https://github.com/Dfam-consortium/RepeatMasker"
homepage = "https://www.repeatmasker.org/"
release_url = "https://github.com/Dfam-consortium/RepeatMasker/releases/tag/v4.2.5"
downloads = "https://codeload.github.com/Dfam-consortium/RepeatMasker/tar.gz/refs/tags/v4.2.5"
version = "4.2.5"
license = "OSL-2.1; utility-specific notices; FamDB CC0; RMBlast/NCBI notices; UCSC CLI MIT"
citation = "Smit, Hubley, and Green; Dfam Consortium; Camacho et al. 2009 for BLAST+"
doi = "10.1186/1471-2105-10-421"
pmid = "20003500"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 300
exist = ["RepeatMasker", "taf-repeatmasker-entrypoint", "taf-repeatmasker-dfam", "taf-repeatmasker-landscape", "taf-repeatmasker-smoke", "ProcessRepeats", "RepeatProteinMask", "DupMasker", "famdb.py", "download_dfam.py", "RM2Bed.py", "rmOutToGFF3.pl", "buildSummary.pl", "calcDivergenceFromAlign.pl", "createRepeatLandscape.pl", "rmToTrackHub.pl", "maskFile.pl", "buildRMLibFromEMBL.pl", "rmblastn", "makeblastdb", "blastx", "trf", "nhmmer", "hmmsearch", "twoBitInfo", "bedToBigBed", "whereis", "python3", "perl", "curl", "gzip"]
test = ["taf-repeatmasker-smoke identity", "taf-repeatmasker-smoke help", "taf-repeatmasker-smoke resource", "taf-repeatmasker-smoke tiny", "taf-repeatmasker-smoke utilities", "taf-repeatmasker-smoke engines", "taf-repeatmasker-smoke ucsc", "taf-repeatmasker-smoke reports"]
